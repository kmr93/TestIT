# Pinned NATS Core Configuration for TestIT
# Ephemeral in-memory messaging for real-time run statistics and status fan-out.
# JetStream is disabled for v1 as SQLite is the durable system of record.

port: 4222
http_port: 8222

# Limit max payload size to 1MB to prevent memory bloat
max_payload: 1MB

# Buffer limits
max_pending: 32MB

# Server identification
server_name: testit-nats-core

# Logging
logtime: true
debug: false
trace: false
